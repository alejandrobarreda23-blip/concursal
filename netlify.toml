# Netlify: instala dependencias, genera dist/ y lo publica.
# Este fichero prevalece sobre la configuración de build del panel de Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Por defecto todo sigue local. Si el usuario activa la extracción IA, el navegador envía únicamente\n# el texto extraído del PDF a una Netlify Function same-origin; la clave del proveedor nunca llega al cliente.\n# Se mantiene bloqueada cualquier conexión directa del navegador a terceros y la indexación por buscadores.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
