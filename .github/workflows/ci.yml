name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Syntax check
        run: |
          node --check web/app.mjs
          node --check netlify/functions/extract-solicitud.mjs
          node --check netlify/functions/assist-case.mjs
      - name: Golden hash report
        run: node scripts/report-golden.mjs
      - name: Regression tests
        run: node --test test/*.test.mjs
      - name: Integrity + full test
        run: npm test
      - run: npm run build
